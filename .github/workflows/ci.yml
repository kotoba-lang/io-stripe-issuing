name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      # No sibling clones: deps.edn names kotoba-lang/card by git coordinate, so
      # this run also proves the provider is consumable from outside the monorepo.
      # No Stripe credential is present, and the suite does not need one: every
      # test drives a recorded transport, never the network.
      - run: clojure -M:test
      - run: clojure -M:lint
